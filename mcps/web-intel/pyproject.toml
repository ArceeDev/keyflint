[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyflint-web-intel"
version = "0.1.0"
description = "Metered MCP server: web pages to clean Markdown, metadata, links, SEO audits and tech stack. Billed per call with KeyFlint credits."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ArceeDev" }]
keywords = ["mcp", "seo", "markdown", "scraping", "keyflint", "agents"]
dependencies = [
    "mcp>=2.0",
    "keyflint-verify[fast]>=1.2.0",
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
keyflint-web-intel = "keyflint_web_intel.server:main"

[project.urls]
Homepage = "https://keyflint.dev/"
Source = "https://github.com/ArceeDev/keyflint/tree/main/mcps/web-intel"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
