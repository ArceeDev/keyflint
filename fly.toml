# fly.toml app configuration file generated for keyforge-f5lsxg on 2026-11-01T17:19:59Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'keyforge-f5lsxg'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  BILLING_MODE = 'mock'
  DATABASE_URL = 'sqlite:////app/data/keyforge.db'
  ENVIRONMENT = 'production'
  PORT = '8000'
  TRUST_PROXY_HEADERS = 'true'

[[mounts]]
  source = 'keyforge_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/readyz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
