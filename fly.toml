# Fly.io: one KeyFlint machine with a persistent volume.
#   fly launch --copy-config --no-deploy --name <your-app>
#   fly volumes create keyforge_data --size 1 --region <region>
#   fly deploy && fly scale count 1
# SQLite = exactly one machine; do not scale horizontally.
app = "keyflint-gateway"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  ENVIRONMENT = "production"
  PORT = "8000"
  DATABASE_URL = "sqlite:////app/data/keyforge.db"
  TRUST_PROXY_HEADERS = "true"
  BILLING_MODE = "mock"

[mounts]
  source = "keyforge_data"
  destination = "/app/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    timeout = "5s"
    method = "GET"
    path = "/readyz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
