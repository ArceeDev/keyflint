[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyforge-verify"
version = "1.1.0"
description = "Zero-dependency offline verifier and MCP tool gating for KeyForge Ed25519 license tokens"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ArceeDev" }]
keywords = ["license", "licensing", "ed25519", "offline", "keyforge", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
fast = ["cryptography>=43.0.0"]
mcp = ["mcp>=1.2"]
test = ["pytest>=8", "cryptography>=43.0.0", "mcp>=1.2"]

[project.urls]
Homepage = "https://arceedev.github.io/keyforge/"
Source = "https://github.com/ArceeDev/keyforge/tree/main/sdks/python-verify"
Issues = "https://github.com/ArceeDev/keyforge/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyforge_verify = ["py.typed"]
