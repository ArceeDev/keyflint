[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "keyflint-verify"
version = "1.2.0"
description = "Zero-dependency offline verifier and MCP tool gating for KeyFlint Ed25519 license tokens"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ArceeDev" }]
keywords = ["license", "licensing", "ed25519", "offline", "keyflint", "mcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Topic :: Security :: Cryptography",
    "Typing :: Typed",
]
dependencies = []

[project.scripts]
keyflint-verify = "keyflint_verify.cli:main"

[project.optional-dependencies]
fast = ["cryptography>=43.0.0"]
mcp = ["mcp>=1.2"]
test = ["pytest>=8", "cryptography>=43.0.0", "mcp>=1.2"]

[project.urls]
Homepage = "https://keyflint.dev/"
Source = "https://github.com/ArceeDev/keyflint/tree/main/sdks/python-verify"
Issues = "https://github.com/ArceeDev/keyflint/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
keyflint_verify = ["py.typed"]
