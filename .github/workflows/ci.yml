name: KeyFlint CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Production Gatekeeper & E2E Matrix (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run 7-Gate Production Verification
        run: python verify_production.py

      - name: Run Deterministic E2E Suite (Strict ResourceWarning)
        run: python -W error::ResourceWarning run_tests.py

  sdks:
    name: SDK conformance (JS, Python, Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: JS build + tests
        working-directory: sdks/js-verify
        run: npm ci && npm test && npm pack --dry-run
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python tests + package check
        working-directory: sdks/python-verify
        run: |
          python -m pip install --upgrade pip build twine
          pip install ".[test]"
          python -m pytest -q tests
          python -m build && twine check --strict dist/*
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Go vet + tests
        working-directory: sdks/go-verify
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test -count=1 ./...

  container-e2e:
    name: Container E2E (one-click deploy path)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build image and verify first boot, privilege drop, redeploy persistence
        run: python scripts/e2e_container.py

  backup-e2e:
    name: Backup E2E (Litestream restore + fail-closed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build image
        run: docker build -t keyflint:e2e .

      - name: Destroy a volume and restore from the replica
        run: python scripts/e2e_backup.py --image keyflint:e2e

  security:
    name: Dependency audit (pip-audit, npm audit, govulncheck)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit hash-locked runtime dependencies
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit --disable-pip --require-hashes -r requirements.lock --progress-spinner off
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Audit JS SDK runtime dependencies
        working-directory: sdks/js-verify
        run: npm audit --omit=dev --audit-level=high
      # Latest stable toolchain: govulncheck also reports stdlib CVEs of the Go used to run it,
      # and SDK users build with their own (current) Go, not the 1.22 conformance toolchain.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: govulncheck Go SDK
        working-directory: sdks/go-verify
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
