# Weekly, grouped update PRs. Python runtime deps are hash-locked in requirements.lock
# (regenerate with the command at its top); CI's `security` job audits it on every PR.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly, day: monday}
    groups: {actions: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly, day: monday}
  - package-ecosystem: npm
    directory: /sdks/js-verify
    schedule: {interval: weekly, day: monday}
    groups: {js-dev: {dependency-type: development}}
    # TypeScript 7 (native compiler) removed moduleResolution=node10, used by the CJS build (#36).
    # Migrate the build deliberately, then drop this.
    ignore:
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: gomod
    directory: /sdks/go-verify
    schedule: {interval: weekly, day: monday}
