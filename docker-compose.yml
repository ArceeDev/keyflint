services:
  keyflint:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/arceedev/keyflint:1.2.2
    container_name: keyflint_gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - HOST=0.0.0.0
      - PORT=8000
      - DATABASE_URL=sqlite:////app/data/keyforge.db
      - LOG_LEVEL=INFO
      - TRUSTED_PROXY_MODE=${TRUSTED_PROXY_MODE:-direct}  # fly|cloudflare|standard|direct
      - SECRET_KEY=${SECRET_KEY}
      - ED25519_PRIVATE_KEY_HEX=${ED25519_PRIVATE_KEY_HEX}
      - ED25519_PUBLIC_KEY_HEX=${ED25519_PUBLIC_KEY_HEX:-}  # empty = derived from the private key
      - ADMIN_API_KEY=${ADMIN_API_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - LEMONSQUEEZY_WEBHOOK_SECRET=${LEMONSQUEEZY_WEBHOOK_SECRET:-}
      - BILLING_MODE=${BILLING_MODE:-mock}
    volumes:
      - keyforge_data:/app/data

volumes:
  keyforge_data:
    driver: local
